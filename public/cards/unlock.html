<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cards">
  <title>Cards · unlock</title>
  <link rel="manifest" href="/cards/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/cards/apple-touch-icon.png">
  <style>
    :root { --bg:#f4f5f7; --surface:#fff; --ink:#111418; --muted:#5b636e; --line:#d9dde3; --accent:#1f5fbf; --bad:#a32020; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0e1013; --surface:#181b20; --ink:#eef0f3; --muted:#9aa3ae; --line:#2a2f37; --accent:#7fb0ff; --bad:#ff8a8a; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
      font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; padding:16px; }
    form { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; }
    h1 { margin:0 0 4px; font-size:24px; }
    p { margin:0 0 14px; color:var(--muted); font-size:14px; }
    input { width:100%; font:inherit; font-size:17px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
    button { margin-top:12px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; }
    .bad { color:var(--bad); min-height:1.2em; margin:8px 0 0; }
  </style>
</head>
<body>
  <form method="post" action="/cards/unlock">
    <h1>Cards</h1>
    <p>Private. Enter the passphrase once on this device; it stays unlocked for 400 days.</p>
    <!-- username field lets iCloud Keychain / Google Password Manager save and fill it -->
    <input type="text" name="username" value="cards" autocomplete="username" hidden>
    <label for="pp" style="position:absolute;left:-9999px">Passphrase</label>
    <input id="pp" name="passphrase" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus>
    <button type="submit">Unlock</button>
    <p class="bad" id="bad" aria-live="polite"></p>
  </form>
  <script>
    if (new URLSearchParams(location.search).has("wrong")) document.getElementById("bad").textContent = "That passphrase is wrong.";
  </script>
</body>
</html>
